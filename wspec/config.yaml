# wSpec Configuration
#
# The context:/rules: override scaffold below is derived from openspec/config.yaml in
# Fission-AI OpenSpec (https://github.com/Fission-AI/OpenSpec), MIT licensed.
# See THIRD-PARTY-NOTICES.md. Modified for wSpec.
schema_version: "1.0"

# Branch strategy: "sequential" → feat/001-name, feat/002-name, ...
branch_numbering: sequential

# What /wspec-finalize should do after archiving the change folder.
# Values:
#   none  — do nothing
#   ask   — prompt: PR / merge / skip (default)
#   pr    — open a pull/merge request via the gh or glab CLI (see `forge` below; requires
#           the matching CLI installed and authed)
#   merge — fast-forward the change branch into the default branch locally
post_archive_action: ask

# Which forge's CLI to use for post_archive_action: pr, and for /wspec-capture issue
# operations (wspec.captureIssue, wspec.listIssues, wspec.getIssue, wspec.commentIssue,
# wspec.updateIssue, wspec.closeIssue).
# Values:
#   auto   — detect from the `origin` remote: github.com → gh, anything else → glab (default)
#   github — always use gh
#   gitlab — always use glab
forge: auto

# Label applied to issues created by /wspec-capture, and used as the default filter for
# wspec.listIssues (e.g. when /wspec-propose is run with no issue reference and needs to
# offer the open captured backlog to pick from).
capture_label: wspec

# What /wspec-implement should do after a phase with real code changes.
# Values:
#   ask  — prompt whether to commit phase progress (default)
#   auto — commit phase progress automatically after validation passes
implement_phase_commits: ask

# How many days a recorded gate override (wspec.recordOverride) stays valid before it
# auto-expires. Overrides also auto-revoke when their underlying finding changes or is
# resolved. Default 14.
override_ttl_days: 14

# Execution-evidence gate (wspec.runChecks). Commands run as evidence at phase gates
# (/wspec-implement step 4c, before the LLM diff-review subagent) and on pre-push.
# Declared, not inferred — this is what keeps wSpec language-agnostic: a PowerShell repo
# writes `Invoke-Pester`, a Python repo writes `pytest`. Absent or empty means the feature
# is off and nothing here changes existing behavior.
#
# checks:
#   test: "npm run test"
#   typecheck: "npm run check"
#   lint: ""                # blank/omitted = skip
#   required: [test]        # which commands must pass to clear a gate; others are advisory
#   timeout_ms: 120000       # optional, default 120000

# Strategy used by /wspec-finalize when post_archive_action is "merge".
# Values:
#   ask    — prompt per change (default)
#   squash — git merge --squash (clean linear history, one commit per feature)
#   merge  — git merge --no-ff (preserves full commit history with merge commit)
#   ff     — git merge --ff-only (fast-forward only, fails if not possible)
merge_strategy: ask

# Project context for AI artifact generation.
# Add your tech stack, conventions, domain knowledge, etc.
# context: |
#   Tech stack: TypeScript, Node.js
#   Domain: e-commerce platform
#   Conventions: conventional commits, trunk-based development

# Per-artifact rule overrides (optional).
# rules:
#   proposal:
#     - Keep proposals under 300 words
#   tasks:
#     - Break tasks into chunks of max 2 hours
#   spec:
#     - All FRs must reference a user story

# Living ticket mirror. When a change packet has a linked forge ticket (metadata.yaml's
# `issue:`, set by wspec.bindTicket), wSpec keeps its description re-rendered from packet state
# on each transition — phase checklist, findings, checks, spend, dates — and posts short comments
# on meaningful events. The mirror is inert with no linked ticket, so this whole block is safe to
# leave commented out: absence always means these defaults, never "off". Uncomment to override.
#
# ticket:
#   enabled: true              # master switch
#   create_on_propose: ask     # ask | always | never — offer to create a ticket from
#                              # /wspec-propose when the change has no source issue
#   sync_on: phase             # transition | phase | task — how often the body re-renders from
#                              # wspec.markTask; transition/phase/appendFindings/archive always
#                              # re-render regardless of this setting
#   events: [packet_created, implementation_started, phase_complete, finding_critical, archived]
#                              # which events post a comment; also available: checks_failed,
#                              # blocked (off by default — noisy)
#   comment_findings_at: CRITICAL   # CRITICAL | HIGH | never
#   show_spend: true           # include the running token/cost table in the body
#   milestone: capability      # capability | none | "<fixed title>" — capability uses
#                              # metadata.yaml's `capability` field as the milestone title
#   due_from_effort: true      # derive a due date from estimated_effort (GitLab only — GitHub
#                              # issues have no due-date field, only milestone due dates)
#   close_on_finalize: true    # close the ticket when /wspec-finalize archives the change
#   timeout_ms: 15000          # per forge CLI call; a slow/offline forge never blocks wSpec
